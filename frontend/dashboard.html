<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - NailBook</title>
  <meta name="description" content="Dashboard administrativo para gestão de marcações e negócio.">
  <meta property="og:title" content="Dashboard - NailBook">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
  <div id="admin-app">
    <!-- Loading State -->
    <div class="loading" id="admin-loading" role="status" aria-live="polite">
      <div class="loading__spinner"></div>
      <p>A carregar dashboard...</p>
    </div>
  </div>

  <script type="module">
    import { initAdminLayout } from './js/admin/layout.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      initAdminLayout();
      
      // Remove loading state
      const loading = document.getElementById('admin-loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
</body>
</html>
